# compose/certify/certify-mtc-mock-fee.properties
#
# Activa pe.gob.mtc.mock.MockFeeDataProviderPlugin como el DataProvider
# plugin de este entorno de pruebas — NO es la configuración real del MTC
# (certify-driver-license.properties, con MtcFeeDataProviderPlugin real
# contra el Servicio Web FEE).
#
# Inji Certify v0.14.0 exige un conjunto amplio de properties de plugin-mode
# incluso con un DataProvider mínimo (p. ej. sin
# mosip.certify.credential-config.issuer.display falla con "Could not resolve
# placeholder"). Base: certify-csvdp-farmer-preauth.properties del proyecto de
# código abierto `verifiably`, adaptado al plugin mock.
#
# mosip.certify.identifier alimenta tanto el credential_issuer del credential
# offer como el aud que JwtProofValidator exige en el proof JWT, y coincide
# con el que io.mosip.vciclient arma a partir del issuer well-known (que usa
# domain.url directo). Por eso domain.url debe ser SOLO host, sin sufijo,
# igual que en mosip/inji-certify (docker-compose-injistack/config/);
# credential_endpoint concatena server.servlet.path por su cuenta. Ver
# "## Discovery" en certify-default.properties.
mosip.certify.integration.data-provider-plugin=MockFeeDataProviderPlugin
mosip.certify.integration.scan-base-package=pe.gob.mtc.mock
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.plugin-mode=DataProvider
mosip.certify.identifier=${mosip.certify.domain.url}
mosip.certify.data-provider-plugin.did-url=${CERTIFY_ISSUER_DID:did:web:certify-nginx}
mosip.certify.data-provider-plugin.id-field-prefix-uri=${mosip.certify.domain.url}/credential/
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020
mosip.certify.data-provider-plugin.rendering-template-id=
mosip.certify.credential-config.issuer.display={\
  {\
    'name': '${ISSUER_DISPLAY_NAME:MTC PoC mDL}',\
    'locale': 'es'\
  }\
}
