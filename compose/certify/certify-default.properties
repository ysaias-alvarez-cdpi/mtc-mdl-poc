## OAuth AS Metadata (Certify as its own auth server for Pre-Auth Code)
# CORRECCIÓN (prueba end-to-end con inji-wallet real, MTC): mosip.certify.oauth.issuer
# es el campo "issuer" que aparece en authorization_servers dentro del
# credential-issuer well-known, y el cliente OID4VCI (io.mosip.vciclient)
# construye <issuer>/.well-known/oauth-authorization-server para resolver
# el authorization server metadata. A diferencia de sus vecinos
# token-endpoint/jwks-uri (que sí concatenan ${server.servlet.path}), este
# campo usaba solo ${mosip.certify.authorization.url} — sin el path
# /v1/certify — así que el cliente pegaba a
# https://localhost:8094/.well-known/oauth-authorization-server (404) en
# vez de https://localhost:8094/v1/certify/.well-known/oauth-authorization-server
# (200, confirmado con curl). "Failed to discover authorization server
# metadata at both endpoints" en los logs del wallet es este síntoma.
# authorization.url volvió a ser domain.url puro (solo host, sin ningún
# path) tras la corrección de rumbo del bloque "## Discovery" — token-
# endpoint/jwks-uri necesitan ${server.servlet.path} explícito de nuevo,
# porque viven en las rutas reales de Spring. oauth.issuer es distinto:
# RFC 8414 exige que el campo "issuer" del propio documento
# oauth-authorization-server coincida con la URL PÚBLICA desde donde se
# sirvió ese documento — y como certify-nginx reescribe
# /.well-known/oauth-authorization-server (raíz pública, sin /v1/certify)
# hacia el endpoint real /v1/certify/.well-known/oauth-authorization-server
# (igual que ya se hace para el issuer well-known), el campo "issuer" debe
# reportar domain.url SIN el servlet path — o el wallet real rechaza el
# documento con "Issuer mismatch: Expected '<domain.url>', got
# '<domain.url><servlet.path>'" (confirmado empíricamente).
mosip.certify.oauth.issuer=${mosip.certify.authorization.url}
mosip.certify.oauth.token-endpoint=${mosip.certify.authorization.url}${server.servlet.path}/oauth/token
mosip.certify.oauth.jwks-uri=${mosip.certify.authorization.url}${server.servlet.path}/.well-known/jwks.json
mosip.certify.oauth.grant-types-supported=authorization_code,urn:ietf:params:oauth:grant-type:pre-authorized_code
mosip.certify.oauth.response-types-supported=code
mosip.certify.oauth.code-challenge-methods-supported=S256
mosip.certify.oauth.interactive-authorization-endpoint=${mosip.certify.authorization.url}${server.servlet.path}/oauth/iar
mosip.certify.oauth.access-token.audience=${mosip.certify.identifier}${server.servlet.path}/issuance/credential

