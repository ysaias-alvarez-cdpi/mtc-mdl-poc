# Certify default properties — adapted for adapter integration testing.
# Changes from upstream reference:
#   - database.hostname → certify-postgres (our container name)
#   - domain.url uses certify-nginx (Docker-internal)
#   - authorization.url uses Certify itself as OAuth AS (Pre-Auth Code flow)

spring.application.name=certify
spring.cloud.config.uri=http://localhost:8888

# DEBUG temporal (prueba end-to-end con inji-wallet real, MTC): diagnosticar
# InsufficientAuthenticationException en el endpoint de descarga de
# credencial — el filtro no ve ningún Bearer token en el request. Quitar
# después de diagnosticar.
logging.level.org.springframework.security=DEBUG
logging.level.io.mosip.certify.filter=DEBUG
logging.level.io.mosip.certify.services.CertifyIssuanceServiceImpl=DEBUG
logging.level.io.mosip.certify.utils.MDocProcessor=TRACE
logging.level.io.mosip.certify.proof=TRACE
logging.level.io.mosip.certify.credential=TRACE

server.port=8090
server.servlet.path=/v1/certify
# Pre-auth access tokens are JWS-signed with the full issuer X.509 chain
# embedded in the `x5c` JOSE header (KeymanagerDBHelper's cert lookup +
# JWSSignature service) — observed live up to ~420KB for a single token.
# Tomcat's classic 8KB header default 400'd every credential request
# carrying that token in its Authorization header — reproduced live via a
# real wallet AFTER the fronting nginx's own header-size limit was
# separately raised (see certify-preauth-nginx/nginx.conf's
# large_client_header_buffers comment): nginx let the request through, and
# Tomcat rejected it next. Both layers needed the same fix independently;
# this is the second.
#
# The property name matters: server.max-http-header-size (the name
# documented as current for Spring Boot 3.2, and the first one tried here)
# is SILENTLY IGNORED by this build — Spring Boot logs no warning for an
# unrecognized property, so the app boots clean and looks fixed, but every
# request above Tomcat's real 8KB default still gets cut off mid-header
# (confirmed via a raw tcpdump capture: the client's TCP stream stopped
# advancing and Tomcat sent "Connection: close" partway through, well
# short of the intended 2MB value), and everything from 8KB up gets a
# blanket 400 with no useful body. server.max-http-request-header-size
# (below) is the name this build's embedded Tomcat actually reads —
# confirmed empirically by testing both names directly against the
# container and observing a real 401 (Spring Security's own
# InsufficientAuthenticationException, reached only once the full oversized
# header is actually accepted) instead of Tomcat's generic 400.
#
# Given the property name itself was wrong on the first attempt with zero
# runtime signal, don't trust this value blind on any future upgrade either
# — re-verify empirically (send an oversized Authorization header, confirm
# a real 401 rather than a bare 400) rather than assuming the name still
# matches.
server.max-http-request-header-size=2097152

openapi.info.title=Certify Service
openapi.info.description=Rest Endpoints for operations related to certify
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
mosip.certify.domain.url=http://certify:${server.port}
openapi.service.server.url=${mosip.certify.domain.url}${server.servlet.path}
openapi.service.server.description=Certify Service
springdoc.swagger-ui.disable-swagger-default-url=true
spring.mvc.servlet.path=${server.servlet.path}

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.main.allow-bean-definition-overriding=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

## Authentication & Authorization
mosip.certify.security.auth.post-urls={}
mosip.certify.security.auth.put-urls={}
mosip.certify.security.auth.get-urls={}

mosip.certify.security.ignore-csrf-urls=**/actuator/**,/favicon.ico,**/error,\
  **/swagger-ui/**,**/v3/api-docs/**,**/issuance/**,**/system-info/**,**/credential-configurations/**,\
  **/.well-known/**,**/ledger-search/**,**/credentials/**,**/oauth/**,**/pre-authorized-data/**,**/credential-offer-data/**

mosip.certify.security.ignore-auth-urls=**/actuator/**,**/error,**/swagger-ui/**,\
  **/v3/api-docs/**, **/issuance/**,**/rendering-template/**,**/system-info/**,**/credential-configurations/**,\
  **/.well-known/**,**/ledger-search/**,**/credentials/**,**/oauth/**,**/pre-authorized-data/**,**/credential-offer-data/**

mosip.certify.security.cors-enabled-get-method-urls=/rendering-template/**

## Discovery
# domain.url e identifier son SOLO host, sin sufijo (igual que en
# mosip/inji-certify, docker-compose-injistack/config/). Agregar un path como
# /v1/certify/issuance a domain.url produce un aud mismatch en el proof JWT:
# el aud real sale de CredentialConfigurationServiceImpl -> issuer well-known
# -> io.mosip.vciclient (confirmado por bytecode) y debe coincidir con
# identifier. Así, buildCredentialEndpoint() (domain.url + server.servlet.path)
# también queda bien formado sin duplicar el path.
mosip.certify.discovery.issuer-id=${mosip.certify.domain.url}${server.servlet.path}

# Certify is its own auth server for Pre-Auth Code flow (no eSignet needed).
mosip.certify.authorization.url=${mosip.certify.domain.url}

mosip.certify.supported.jwt-proof-alg={'RS256','PS256', 'ES256', 'Ed25519'}
mosip.certify.plugin-mode=DataProvider

mosip.certify.cnonce-expire-seconds=40

# mosip.certify.identifier (= domain.url, solo host) se define en
# certify-mtc-mock-fee.properties — ver la nota ahí.
mosip.certify.authn.filter-urls={ '${server.servlet.path}/issuance/credential', '${server.servlet.path}/issuance/vd11/credential', '${server.servlet.path}/issuance/vd12/credential' }
# Debe coincidir EXACTO con el iss real del access token que Certify
# mismo emite (= mosip.certify.oauth.issuer, más abajo — authorization.url
# solo host, sin server.servlet.path) — confirmado con
# "JwtValidationException: The iss claim is not valid" cuando estas dos
# properties quedaron desalineadas (empíricamente, mismo patrón que
# credential_issuer/identifier y el issuer well-known del auth server).
mosip.certify.authn.issuer-uri=${mosip.certify.authorization.url}
mosip.certify.authn.jwk-set-uri=${mosip.certify.authorization.url}${server.servlet.path}/.well-known/jwks.json
# The `aud` certify's AccessTokenValidationFilter requires in the eSignet-issued
# access token. Defaults to ${domain.url}.../issuance/credential (public on both
# instances). The AUTH-CODE instance overrides it to the INTERNAL certify endpoint
# via AUTHCODE_ALLOWED_AUD, because eSignet issues that token with the internal aud
# (its scope-resource-mapping stays internal) — letting auth-code VCs carry a PUBLIC
# credential_issuer + status-list URL while claiming still validates. Pre-auth leaves
# AUTHCODE_ALLOWED_AUD unset → keeps the ${domain.url} default (its own public host).
mosip.certify.authn.allowed-audiences={ '${AUTHCODE_ALLOWED_AUD:${mosip.certify.domain.url}${server.servlet.path}/issuance/credential}' }

## Actuator
# Restricted to health + info: docker-compose.yml's healthcheck depends on
# GET /v1/certify/actuator/health (confirmed the only Actuator endpoint
# anything in this deployment consumes). The previous `include=*` +
# `show-values=ALWAYS` combination, reachable through certify-nginx's public
# `location /v1/certify/` (a generic proxy with no exclusion for /actuator/),
# meant an unauthenticated GET /v1/certify/actuator/env returned every
# environment variable this container has — including CERTIFY_PG_PASSWORD —
# in plaintext, and /heapdump/threaddump were reachable the same way. `**/actuator/**`
# staying in ignore-auth-urls below is fine now that exposure itself is capped:
# there is nothing sensitive left behind health/info to reach without auth.
management.endpoints.web.exposure.include=health,info

## Key-manager
mosip.kernel.crypto.asymmetric-algorithm-name=RSA/ECB/OAEPWITHSHA-256ANDMGF1PADDING
mosip.kernel.crypto.symmetric-algorithm-name=AES/GCM/NoPadding
mosip.kernel.keygenerator.asymmetric-algorithm-name=RSA
mosip.kernel.keygenerator.symmetric-algorithm-name=AES
mosip.kernel.keygenerator.asymmetric-key-length=2048
mosip.kernel.keygenerator.symmetric-key-length=256
mosip.kernel.data-key-splitter=#KEY_SPLITTER#
mosip.kernel.crypto.gcm-tag-length=128
mosip.kernel.crypto.hash-algorithm-name=PBKDF2WithHmacSHA512
mosip.kernel.crypto.hash-symmetric-key-length=256
mosip.kernel.crypto.hash-iteration=100000
mosip.kernel.crypto.sign-algorithm-name=RS256
mosip.kernel.certificate.sign.algorithm=SHA256withRSA

mosip.kernel.keymanager.hsm.config-path=CERTIFY_PKCS12/local.p12
mosip.kernel.keymanager.hsm.keystore-type=PKCS12
mosip.kernel.keymanager.hsm.keystore-pass=local

# CORRECCIÓN (hallazgo empírico, prueba end-to-end con inji-wallet real, MTC):
# el país (`country=IN`) de estos dos bloques queda embebido como el Subject
# DN (C=IN) del certificado DS con el que Certify firma el MSO de cada mDL.
# MsoMdocVerifier.verifyCountryName() (io.mosip:vcverifier-aar:1.5.0, la
# librería NATIVA de verificación de inji-wallet) extrae el C= de ese
# certificado vía regex y lo compara contra el campo issuing_country del
# propio mDL — con el certificado demo de MOSIP (C=IN) y un mDL de Perú
# (issuing_country: "PE"), la comparación siempre falla con
# InvalidPropertyException("Issuing country is not valid in the credential
# - Mismatch in credential data and DS certificate country name found"),
# y verify() retorna false — el mDL nunca se persiste en la wallet, aunque
# la emisión server-side (VC_ISSUANCE) haya sido exitosa. Confirmado
# reproduciendo verifyCountryName() en Python contra un mDL real emitido
# por este entorno (certificado decodificado con `cryptography`, digest de
# valueDigests verificado aparte y correcto — este es el único check que
# falla). No es un bug de Certify ni del parche de portrait: es un
# mismatch de configuración de entorno, presente desde el primer arranque
# de este POC, que ningún intento anterior había alcanzado a ejercitar
# (todos fallaban antes, en la descarga o en la emisión server-side).
mosip.kernel.keymanager.certificate.default.common-name=www.example.com
mosip.kernel.keymanager.certificate.default.organizational-unit=MTC
mosip.kernel.keymanager.certificate.default.organization=Ministerio de Transportes y Comunicaciones
mosip.kernel.keymanager.certificate.default.location=Lima
mosip.kernel.keymanager.certificate.default.state=Lima
mosip.kernel.keymanager.certificate.default.country=PE

mosip.kernel.keymanager.softhsm.certificate.common-name=www.example.com
mosip.kernel.keymanager.softhsm.certificate.organizational-unit=MTC
mosip.kernel.keymanager.softhsm.certificate.organization=Ministerio de Transportes y Comunicaciones
mosip.kernel.keymanager.softhsm.certificate.country=PE

mosip.kernel.partner.sign.masterkey.application.id=PMS
mosip.kernel.partner.allowed.domains=DEVICE

mosip.kernel.keymanager.jwtsign.validate.json=false
mosip.keymanager.dao.enabled=false
crypto.PrependThumbprint.enable=true

mosip.kernel.keymgr.hsm.health.check.enabled=true
mosip.kernel.keymgr.hsm.health.key.app-id=CERTIFY_SERVICE
mosip.kernel.keymgr.hsm.healthkey.ref-id=TRANSACTION_CACHE
mosip.kernel.keymgr.hsm.health.check.encrypt=true

