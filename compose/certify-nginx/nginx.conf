# compose/certify-nginx/nginx.conf
# DEBUG temporal (prueba end-to-end con inji-wallet real, MTC): capturar el
# body crudo del POST a /issuance/credential (contiene el proof JWT con el
# holder key) para diagnosticar "Illegal base64 character" en
# MDocProcessor.createDeviceKeyInfo — sin tocar ningún bytecode de Certify.
# Quitar (log_format + access_log línea) después de diagnosticar.
log_format proof_debug '$time_iso8601 $request_method $request_uri BODY: $request_body';

server {
    listen 80;
    server_name certify-nginx;

    location / {
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name certify-nginx;

    ssl_certificate /etc/nginx/certs/localhost-cert.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    # CORRECCIÓN (prueba end-to-end con inji-wallet real, MTC): mosip.certify.domain.url
    # (= credential_issuer público, sin path — como en un despliegue real
    # de MOSIP, docker-compose-injistack/config/certify-default.properties)
    # no coincide con dónde vive realmente el well-known en este entorno
    # (/v1/certify/issuance/.well-known/..., porque server.servlet.path
    # comparte host:puerto con domain.url en vez de vivir en un dominio
    # dedicado como en producción real). io.mosip.vciclient construye
    # <credential_issuer>/.well-known/openid-credential-issuer — sin esta
    # location, esa ruta pública no existe (404). Esta reescritura imita lo
    # que haría el reverse-proxy real de un despliegue de producción con
    # dominio dedicado, sin tocar ninguna property de Certify.
    location = /.well-known/openid-credential-issuer {
        proxy_pass http://certify:8090/v1/certify/issuance/.well-known/openid-credential-issuer;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://certify:8090/v1/certify/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/certify/issuance/credential {
        access_log /var/log/nginx/proof_debug.log proof_debug;
        proxy_pass http://certify:8090/v1/certify/issuance/credential;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
